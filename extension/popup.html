<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KarirHub Auto Tracer</title>
  <style>
    :root {
      --bg: #FBFBFA;
      --surface: #FFFFFF;
      --border: #EAEAEA;
      --text: #111111;
      --text-muted: #787774;
      --accent-yellow: #FBF3DB;
      --accent-yellow-text: #956400;
      --accent-green: #EDF3EC;
      --accent-green-text: #346538;
      --accent-red: #FDEBEC;
      --accent-red-text: #9F2F2D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .brand-title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge-online {
      background: var(--accent-green);
      color: var(--accent-green-text);
    }

    .badge-offline {
      background: var(--accent-red);
      color: var(--accent-red-text);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .sync-card {
      background: #FBFBFA;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-field:focus {
      border-color: #111111;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      font-family: monospace;
    }

    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: #111111;
      color: #FFFFFF;
      border-color: #111111;
      margin-bottom: 8px;
    }

    .btn-primary:hover {
      background: #2A2A2A;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg);
    }

    .btn-sync {
      background: var(--accent-yellow);
      color: var(--accent-yellow-text);
      border-color: #F3E7C4;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .btn-sync:hover {
      background: #F5E9C9;
    }

    .status-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-title">KarirHub Auto Tracer</div>
    <div id="statusBadge" class="badge badge-offline">
      <span class="dot"></span>
      <span id="statusText">Memeriksa...</span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div id="statTotal" class="stat-val">-</div>
      <div class="stat-lbl">Total Terlacak</div>
    </div>
    <div class="stat-box">
      <div id="statInterview" class="stat-val">-</div>
      <div class="stat-lbl">Interview</div>
    </div>
  </div>

  <!-- Realtime Background Sync Panel -->
  <div class="sync-card">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
      <span style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: #111111;">Auto-Sync Realtime</span>
      <span style="font-size: 10px; color: #346538; font-weight: 600;">● TIAP 15 MNT</span>
    </div>
    <div id="syncStatusDesc" style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">
      Memeriksa perubahan status di KarirHub di background tanpa buka tab.
    </div>
    <button id="btnTriggerSync" class="btn btn-sync">
      <span id="syncBtnText">🔄 Cek Status Semua Lowongan Sekarang</span>
    </button>
  </div>

  <div class="card">
    <div class="field-label">Alamat API Tracer Dashboard</div>
    <input type="text" id="apiUrlInput" class="input-field" value="http://localhost:3000" placeholder="http://localhost:3000" />
  </div>

  <button id="btnSaveApi" class="btn btn-secondary" style="margin-bottom: 8px;">Uji & Simpan Koneksi</button>
  <button id="btnOpenDashboard" class="btn btn-primary">Buka Web Dashboard</button>

  <div class="status-hint">
    Otomatis mencatat & memperbarui status lowongan tanpa Anda harus membuka web KarirHub.
  </div>

  <script src="popup.js"></script>
</body>
</html>
